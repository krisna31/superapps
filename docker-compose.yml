services:
  postgres:
    image: postgres:16-alpine
    container_name: superapps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: superapps
      POSTGRES_PASSWORD: superappspassword
      POSTGRES_DB: superapps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superapps -d superapps_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
