<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="description" content="Superapps Workspace - Productivity and Developer Tools in 1 PWA | Multi-Theme Design System" />
    <title>Superapps Workspace</title>
    <!-- Multi-Theme Font Assets (Preconnect + Binary-Verified Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto+Flex:wght@100..1000&family=Roboto+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <!-- Zero-FOUC Theme Archetype & Polarity Initializer -->
    <script type="text/javascript">
      (function() {
        var validArchetypes = ['ios-system', 'android-material', 'honkai-valkyrie', 'zenless-urban', 'werkbund-brutalist', 'retro-amber-crt', 'pure-monolith'];
        var savedArchetype = localStorage.getItem('superapps_theme_archetype');
        var archetype = (validArchetypes.indexOf(savedArchetype) !== -1) ? savedArchetype : 'ios-system';

        var savedMode = localStorage.getItem('superapps_theme_mode') || localStorage.getItem('superapps_theme') || localStorage.getItem('ui-theme-mode');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = (savedMode === 'light' || savedMode === 'dark') ? savedMode : (prefersDark ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme-archetype', archetype);
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.classList.add('theme-' + archetype);
        document.documentElement.classList.toggle('dark', mode === 'dark');
        document.documentElement.classList.toggle('light', mode === 'light');
      })();
    </script>
    <!-- GitHub Pages SPA routing script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var safePath = (l.pathname.slice(0, -1) + decoded + l.hash).replace(/^[\/\\]+/, '/');
          window.history.replaceState(null, null, safePath);
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-canvas text-ink font-sans min-h-screen antialiased selection:bg-[#0055D6] selection:text-white dark:selection:bg-[#479EFF] dark:selection:text-[#00142A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
