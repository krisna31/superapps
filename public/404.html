<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Superapps</title>
    <script type="text/javascript">
      // SPA for GitHub Pages redirection script
      // Preserves paths and queries across GitHub Pages static 404s
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#090d16;color:#fff;">
      <p>Redirecting to Superapps...</p>
    </div>
  </body>
</html>
