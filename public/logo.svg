<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </linearGradient>

    <!-- Badge Outer Rim Border -->
    <linearGradient id="logo-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Electric Cyan to Blue -->
    <linearGradient id="logo-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Violet to Magenta -->
    <linearGradient id="logo-violet-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Core Spark Node -->
    <linearGradient id="logo-spark-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(0, 0)">
    <!-- Base Squircle -->
    <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#logo-bg)" stroke="url(#logo-rim)" stroke-width="1.5" />
    
    <!-- Upper Wing -->
    <path
      d="M 14 16.5 C 14 12.8 17.5 9.5 22.8 9.5 L 31.5 9.5 C 35.2 9.5 38 12.2 38 15.6 C 38 19 35.5 21.5 31.4 22.3 L 24.8 23.8 C 20.6 24.7 18.2 27 18.2 30.6 L 18.2 31.8 L 13 31.8 L 13 29.5 C 13 24.2 16.4 20.5 21.7 19.3 L 28.5 17.8 C 30.6 17.3 31.8 16.3 31.8 15.1 C 31.8 13.8 30.2 13 28.1 13 L 22.2 13 C 19.8 13 18.2 14 17.7 15.8 Z"
      fill="url(#logo-cyan-blue)"
    />

    <!-- Lower Wing -->
    <path
      d="M 34 31.5 C 34 35.2 30.5 38.5 25.2 38.5 L 16.5 38.5 C 12.8 38.5 10 35.8 10 32.4 C 10 29 12.5 26.5 16.6 25.7 L 23.2 24.2 C 27.4 23.3 29.8 21 29.8 17.4 L 29.8 16.2 L 35 16.2 L 35 18.5 C 35 23.8 31.6 27.5 26.3 28.7 L 19.5 30.2 C 17.4 30.7 16.2 31.7 16.2 32.9 C 16.2 34.2 17.8 35 19.9 35 L 25.8 35 C 28.2 35 29.8 34 30.3 32.2 Z"
      fill="url(#logo-violet-pink)"
    />

    <!-- Spark Diamond -->
    <polygon points="24,20.5 27.5,24 24,27.5 20.5,24" fill="url(#logo-spark-core)" />
    
    <!-- Precision Dots -->
    <circle cx="16.5" cy="11.5" r="1.5" fill="#38bdf8" />
    <circle cx="31.5" cy="36.5" r="1.5" fill="#c026d3" />
  </g>

  <!-- Typography Wordmark -->
  <text x="58" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.5">Superapps<tspan fill="#3b82f6">OS</tspan></text>
</svg>
